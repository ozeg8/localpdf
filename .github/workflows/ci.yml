name: Validate LocalPDF
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: localpdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require reviewed lockfile
        run: node -e "require('node:fs').accessSync('package-lock.json')"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run scan:secrets
      - run: npm run check:repository
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
